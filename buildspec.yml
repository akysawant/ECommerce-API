version: 0.2

phase:
  pre_build:
    commands:
      - echo "starting restore.."
      - donet restore ECommerce.sln
  
  build:
    commands:
      - echo "starting build..."
      - dotnet build ECommerce.API/ECommerce.API.csproj --configuration Release --no-restore

  post_build:
    commands:
      - echo "starting publish..."
      - dotnet publish ECommerce.API/ECommerce.API.csproj --configuration Release --no-restore --output ./publish

artifacts:
  files:
    - '**/*'
  base-directory: publish

  